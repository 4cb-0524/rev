<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>rev</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root{--bg:#000;--pn:#232326;--ink:#fff;--mut:#8b8b92;--ln:#2f2f33;--ac:#2de2e6;--st:#141416;--on:#000;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;font-weight:500}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;height:48px;flex:none}
h1{font-size:17px;font-weight:900;margin:0;letter-spacing:.02em}
button{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--ln);border-radius:10px;min-height:40px;padding:0 14px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.pri{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:900;border-radius:999px}
button:disabled{opacity:.5}
#stage{flex:1;min-height:120px;background:var(--st);position:relative;overflow:hidden}
#zr{position:absolute;right:10px;bottom:10px;min-height:32px;padding:0 12px;font-size:12px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;border-color:#444;z-index:2}
#zr[hidden]{display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;touch-action:none}
#tp{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 10px;flex:none}#tm{order:-1}#tp #rw{order:1;justify-self:end;border:0;background:none}#tp #pl{border-radius:50%;background:#fff;color:#000;border:0}.mid{display:flex;gap:6px;align-items:center}#tp #kb,#tp #ct,#tp #rw{width:40px}#tp #ct{border-radius:50%;background:none}#tp #ct svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}#tm{font-size:12px}.rt{order:1;justify-self:end;display:flex;gap:2px}#tp #un,#tp #re{width:36px;border:0;background:none}#tp #un svg,#tp #re svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}#tp button:disabled{opacity:.3}#tp #kb{border-radius:50%;background:none}#tp #kb svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}#tp #kb.on{background:var(--ac);color:#000;border-color:var(--ac)}#tp #kb.on svg{fill:currentColor}#kb.on .pp{display:none}
#tp button{width:44px;padding:0;display:grid;place-items:center}
#tp svg{width:18px;height:18px;fill:currentColor}
#tm{font-variant-numeric:tabular-nums;color:var(--mut);font-size:14px}
.tl{position:relative;margin:0;border-top:1px solid var(--ln);background:#000;flex:none;overflow:hidden}
#tls{overflow:auto;max-height:124px;overscroll-behavior:contain;touch-action:pan-x pan-y}
#tlin{position:relative;min-width:100%}
.ruler,.row{display:grid;grid-template-columns:64px 1fr}
.ruler{height:22px;color:var(--mut);font-size:11px;position:sticky;top:0;z-index:3;background:#000;touch-action:none}.ruler>span{position:sticky;left:0;z-index:3;background:#000}
#tk{position:relative}
#tk span{position:absolute;top:4px;transform:translateX(-50%)}
#tk span:first-child{transform:none;margin-left:3px}
#rows{}
.row{height:36px;align-items:center}
.row.on .bar{outline:2px solid #fff;outline-offset:1px}
.lb{font-size:12px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;z-index:2;background:#000;align-self:stretch;display:flex;align-items:center}
.hd{position:absolute;top:4px;width:16px;height:28px;background:#fff;border-radius:6px;z-index:2;touch-action:none}.hd::after{content:"";position:absolute;left:7px;top:8px;width:2px;height:12px;background:#000;border-radius:1px}
.tr{position:relative;height:100%}
.bar{position:absolute;top:6px;height:24px;border-radius:6px;font-size:11px;font-style:normal;font-weight:700;line-height:24px;color:#000;padding:0 8px;overflow:hidden;white-space:nowrap}
.kf{position:absolute;top:14px;width:8px;height:8px;background:#fff;transform:translateX(-50%) rotate(45deg);border:1px solid #000;z-index:1}.kf.on{background:var(--ac);border-color:#fff;width:10px;height:10px;top:13px}
.empty{margin:10px;color:var(--mut);font-size:12px}
#ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;margin-left:-1px}
#ph::before{content:"";position:absolute;top:0;left:-5px;width:12px;height:12px;border-radius:0 0 6px 6px;background:#fff}
#tabs{display:flex;background:#000;flex:none}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:0;background:none;color:var(--mut);font-size:10px;min-height:54px}
#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-selected="true"]{color:#fff;font-weight:700}
#panel{height:250px;overflow-y:auto;padding:12px 14px;flex:none;background:#111113;border-radius:16px 16px 0 0}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g button{min-height:48px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips button{min-height:38px;border-radius:999px}
.chips button.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:900}
.f{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;color:var(--mut)}
.f input[type=range]{width:100%;accent-color:var(--ac)}
.f input[type=text]{width:100%;min-height:38px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);padding:0 10px;font:inherit}
.sw{display:flex;gap:8px;align-items:center}
.sw button{width:32px;height:32px;min-height:0;padding:0;border-radius:50%}
.sw input{width:36px;height:32px;border:0;padding:0;background:none}
.hint{color:var(--mut);font-size:13px;margin:8px 0}
.ce{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}.ce>div{flex:1;min-width:0}.ce .hint{margin:0 0 8px}#cvz{touch-action:none;flex:none}
#bk{width:40px;padding:0;border:0;background:none;display:grid;place-items:center}
#pn{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-weight:900;font-size:16px;text-align:center;padding:0 6px;min-height:40px}
#home{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#home[hidden]{display:none}
#home h1{font-size:22px}
#plist{flex:1;overflow-y:auto;padding:8px 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-content:start}
.card{background:var(--pn);border-radius:12px;overflow:hidden;cursor:pointer}
.card .th{aspect-ratio:9/16;background:#000 center/contain no-repeat}
.card .nm{padding:8px 10px 2px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dt{padding:0 10px 8px;font-size:11px;color:var(--mut);display:flex;justify-content:space-between;align-items:center;gap:6px}
.card .dt button{min-height:30px;padding:0 8px;font-size:11px;border-radius:8px}
#newp{margin:12px 16px;min-height:52px;font-size:16px}
#res{background:var(--pn);color:var(--ink);border:1px solid var(--ln);border-radius:999px;min-height:40px;padding:0 10px;margin:0 8px;font:inherit;font-size:12px;white-space:nowrap}
#rs,#js,#md,#rd{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
#rs[hidden],#js[hidden],#md[hidden],#rd[hidden]{display:none}
.sheet{width:100%;background:#161618;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:16px}
.f2{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px}
.f2 label{flex:1;font-size:12px;color:var(--mut);display:grid;gap:4px}
.f2 input{min-height:44px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 10px;width:100%}
.f2 span{padding-bottom:12px;color:var(--mut)}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
label.btn{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;background:var(--pn);border:1px solid var(--ln);cursor:pointer;font-size:14px}
#jst{width:100%;height:150px;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace;margin-bottom:12px;resize:none}
#pz{min-height:64px;border:1px dashed var(--ln);border-radius:12px;padding:12px;color:var(--mut);margin-bottom:12px;font-size:13px}
.fr{display:flex;gap:8px;align-items:center;min-width:0}.fr input[type=range]{flex:1;min-width:0;accent-color:var(--ac)}
.fr input[type=number]{flex:1;min-width:0;min-height:36px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);padding:0 8px;font:inherit}
.eb{width:36px;min-height:36px;padding:0;display:grid;place-items:center;border-radius:10px;flex:none}
.eb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.eb.on{background:var(--ac);color:#000;border-color:var(--ac)}
.f select{width:100%;min-height:38px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);padding:0 10px;font:inherit}
.f input[type=checkbox]{width:26px;height:26px;accent-color:var(--ac)}
.ax{display:flex;align-items:center;gap:3px;flex:1;min-width:0}.ax i{font-style:normal;font-size:11px;color:var(--mut)}.ax input{width:100%;padding:0 4px!important}
.fr output{min-width:40px;text-align:right;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}.sp{width:36px;flex:none}
.fr input.nv{flex:none;width:66px;min-height:34px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);padding:0 6px;font:inherit;font-size:13px;text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield}.fr input.nv::-webkit-inner-spin-button,.fr input.nv::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pbar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden;margin:4px 0 8px}.pbar i{display:block;height:100%;width:0;background:var(--ac)}
.fxc{background:var(--pn);border-radius:12px;padding:10px 10px 4px;margin-bottom:10px}.fxh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.fxh span{display:flex;gap:6px}.fxh b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fxb{min-height:30px;padding:0 10px;font-size:12px;border-radius:8px}.fxb.on{background:var(--ac);color:#000;border-color:var(--ac)}.wf{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.5;pointer-events:none}.wf path{fill:#000}.sec{margin:14px 0 8px;font-size:13px;color:var(--mut);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 310px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
<header><button id="bk" aria-label="プロジェクト一覧へ"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><input id="pn" aria-label="プロジェクト名" maxlength="30"><button id="res" aria-label="解像度">1080×1920</button><button id="exp" class="pri">書き出し</button></header>
<main id="stage"><canvas id="cv" width="540" height="960"></canvas><button id="zr" hidden>リセット</button></main>
<div id="tp"><div class="rt"><button id="un" aria-label="元に戻す"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button><button id="re" aria-label="やり直し"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button><button id="rw" aria-label="先頭へ"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button></div><div class="mid"><button id="pl" aria-label="再生"></button><button id="kb" aria-label="キーフレームを追加"><svg viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9z"/><path class="pp" d="M12 8v8M8 12h8"/></svg></button><button id="ct" aria-label="分割"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.1 8.1L20 20M8.1 15.9L20 4"/></svg></button></div><span id="tm"></span></div>
<section class="tl" id="tl"><div id="tls"><div id="tlin"><div class="ruler"><span></span><div id="tk"></div></div><div id="rows"></div><div id="ph"></div></div></div></section>
<section id="panel"></section>
<nav id="tabs"><button data-tab="add" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>追加</button><button data-tab="adj" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>プロパティ</button><button data-tab="fx" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>エフェクト</button></nav>
</div>
<div id="home"><header><h1>rev</h1></header><div class="sec" style="margin:0 16px 4px">プロジェクト</div><div id="plist"></div><button id="newp" class="pri">＋ 新規プロジェクト</button></div>
<div id="js" hidden><div class="sheet"><h2>JSを読み込む</h2><textarea id="jst" spellcheck="false" placeholder="コードを貼り付け:drawLayer(ctx, t, info) を定義"></textarea><div class="chips"><label class="btn" for="jsf">ファイルを選ぶ</label><input id="jsf" class="vh" type="file" accept=".js,.mjs,.txt,text/javascript,application/javascript,text/plain"><button class="pri" id="jsa">貼り付けを読み込む</button><button id="jsx">閉じる</button></div></div></div>
<div id="md" hidden><div class="sheet"><h2>メディアを追加</h2><div id="pz" contenteditable="true" role="textbox" aria-label="画像を貼り付け">ここに画像を貼り付け(またはドロップ)</div><div class="chips"><label class="btn" for="mdf">画像・動画・音声を選ぶ</label><input id="mdf" class="vh" type="file" accept="image/*,video/*,audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac"><button id="mdx">閉じる</button></div></div></div>
<div id="rd" hidden><div class="sheet"><h2>レンダリング</h2><p class="hint" id="rdi"></p><div class="chips" id="rdf"></div><div class="chips" id="rdq"></div><div id="rdp" hidden><div class="pbar"><i id="rdb"></i></div><p class="hint" id="rdt"></p></div><div class="chips"><button class="pri" id="rds">レンダリング開始</button><button id="rdr">リアルタイム録画</button><button id="rdx">閉じる</button></div></div></div>
<div id="rs" hidden><div class="sheet"><h2>解像度</h2><div class="chips" id="rsc"></div><div class="f2"><label>幅<input id="rsw" type="number" inputmode="numeric" min="144" max="4096" step="2"></label><span>×</span><label>高さ<input id="rsh" type="number" inputmode="numeric" min="144" max="4096" step="2"></label></div><div class="chips"><button class="pri" id="rsa">適用</button><button id="rsx">閉じる</button></div></div></div>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv');let cx=cv.getContext('2d'),DUR=6,W=540,H=960;
const COL=['#ffb21e','#ff5d73','#4dd4ac','#6c8cff','#ffffff'],K=['x','y','s','r','o','z','rx','ry'];
const EASE={lin:p=>p,out:p=>1-Math.pow(1-p,3),inout:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
back:p=>{const c=1.70158,d=c+1;return 1+d*Math.pow(p-1,3)+c*Math.pow(p-1,2)},
bounce:p=>{const n=7.5625,d=2.75;if(p<1/d)return n*p*p;if(p<2/d)return n*(p-=1.5/d)*p+.75;if(p<2.5/d)return n*(p-=2.25/d)*p+.9375;return n*(p-=2.625/d)*p+.984375}};
const EN={lin:'リニア',out:'なめらか',inout:'ゆっくり',back:'オーバー',bounce:'バウンド'};
const BZ={lin:[0,0,1,1],out:[.215,.61,.355,1],inout:[.645,.045,.355,1],back:[.175,.885,.32,1.275]};
function bez(a,p){const[x1,y1,x2,y2]=a,X=u=>3*(1-u)*(1-u)*u*x1+3*(1-u)*u*u*x2+u*u*u,Y=u=>3*(1-u)*(1-u)*u*y1+3*(1-u)*u*u*y2+u*u*u;let lo=0,hi=1,u=p;for(let i=0;i<20;i++){u=(lo+hi)/2;X(u)<p?lo=u:hi=u}return Y(u)}
const ez=b=>b.bz?q=>bez(b.bz,q):EASE[b.e||'lin'];
const bzOf=k=>k.bz||(k.e==='bounce'?null:BZ[k.e]||BZ.lin);
function setEase(k,n){if(n==='bounce'){k.bz=null;k.e='bounce'}else{k.bz=[...BZ[n]];k.e=n}}
function seg(l){const k=l.kf;if(k.length<2)return null;let i=k.findIndex(q=>q.t>t+.03);if(i<1)i=i<0?k.length-1:1;return k[i]}
const PRE={fade:['フェードイン',b=>[{t:0,o:0},{t:.8}]],slide:['スライド',b=>[{t:0,y:b.y+160,o:0},{t:.8}]],
pop:['ポップ',b=>[{t:0,s:0,o:0},{t:.7,e:'back'}]],spin:['スピン',b=>[{t:0,r:b.r-180,s:b.s*.2,o:0},{t:.9}]],
drop:['ドロップ',b=>[{t:0,y:b.y-320,o:0},{t:.9,e:'bounce'}]],pulse:['パルス',b=>[{t:0},{t:.5,s:b.s*1.25,e:'inout'},{t:1,e:'inout'}]]};
let K2=1,RW=1080,RH=1920,L=[],sel=null,t=0,playing=false,last=0,exporting=false,uid=1,tab='add',drag=null;
const cur=()=>L.find(l=>l.id===sel);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const G={x:'pos',y:'pos',z:'pos',s:'scl',r:'rot',rx:'rot',ry:'rot',o:'opa'},DEFV={s:1,o:1};
const nz=o=>{const r={};K.forEach(n=>r[n]=o[n]??DEFV[n]??0);return r};
function spec(k,g){const s=k.E&&k.E[g];return s!==undefined?s:(k.bz||k.e||'lin')}
const ezf=s=>Array.isArray(s)?q=>bez(s,q):(EASE[s]||EASE.lin);
const bzS=s=>Array.isArray(s)?s:(s==='bounce'?null:BZ[s]||BZ.lin);
function props(l,tm){const k=l.kf;if(!k.length)return nz(l);if(tm<=k[0].t)return nz(k[0]);if(tm>=k[k.length-1].t)return nz(k[k.length-1]);
let i=0;while(k[i+1].t<tm)i++;const a=nz(k[i]),b=nz(k[i+1]),u=(tm-k[i].t)/(k[i+1].t-k[i].t),f={},o={};
K.forEach(n=>{const g=G[n];if(f[g]===undefined)f[g]=ezf(spec(k[i+1],g))(u);o[n]=a[n]+(b[n]-a[n])*f[g]});return o}
function setP(l,n,v){if(!l.kf.length){l[n]=v;return}
let k=l.kf.find(q=>Math.abs(q.t-t)<.03);

function drawLayer(ctx, t, info) {

const fps=rfps,N=Math.round(DUR*fps),bps=Math.round(RW*RH*fps*RQ[rq][1]);let cfg=null,codec='';
for(const c of['vp09.00.51.08','vp09.00.41.08','vp8']){try{const r=await VideoEncoder.isConfigSupported({codec:c,width:RW,height:RH,bitrate:bps,framerate:fps});if(r.supported){cfg=r.config;codec=c;break}}catch(e){}}
if(!cfg)return toast('この解像度ではレンダリングできません。解像度を下げてください');
const ch=[];let err=null;const enc=new VideoEncoder({output:c=>{const d=new Uint8Array(c.byteLength);c.copyTo(d);ch.push({ts:Math.round(c.timestamp/1000),key:c.type==='key',data:d})},error:e=>{err=e}});enc.configure(cfg);
const t0=t,pl=playing;RENDER=true;exporting=true;rcancel=false;playing=false;K2=RW/W;cv.width=RW;cv.height=RH;$('#rdp').hidden=false;$('#rdb').style.width='0';rbusy(true);
let au=null;try{$('#rdt').textContent='音声をミックス中…';au=await audioTrack();for(let i=0;i<N;i++){if(rcancel||err)break;t=i/fps;await rprep();draw();const fr=new VideoFrame(cv,{timestamp:Math.round(i*1e6/fps)});enc.encode(fr,{keyFrame:i%fps===0});fr.close();
while(enc.encodeQueueSize>6)await new Promise(r=>setTimeout(r,5));
if(i%3===0||i===N-1){$('#rdb').style.width=((i+1)/N*100)+'%';$('#rdt').textContent=`${i+1} / ${N} フレーム(${Math.round((i+1)/N*100)}%)`;await new Promise(r=>setTimeout(r))}}
if(!rcancel&&!err)await enc.flush()}catch(e){err=e}
finally{RENDER=false;exporting=false;t=t0;playing=pl;resetCv();rbusy(false)}
try{enc.close()}catch(e){}
if(rcancel){$('#rdp').hidden=true;return toast('レンダリングを中止しました')}
if(err||!ch.length)return toast('レンダリングに失敗しました');
$('#rdt').textContent='完了しました';await saveBlob(new Blob([webm(ch,RW,RH,fps,codec,au)],{type:'video/webm'}),'rev.webm')}
function cutLayer(){const l=cur();if(!l)return toast('分割するレイヤーを選択してください');if(exporting)return;
if(!(t>l.st+.05&&t<l.en-.05))return toast('再生位置をレイヤーの範囲内に合わせてください');
const c=JSON.parse(JSON.stringify(l));c.id=uid++;c.st=t;c.off=(l.off||0)+(t-l.st);l.en=t;L.splice(L.indexOf(l)+1,0,c);sel=c.id;tl();pan();toast('分割しました')}
$('#ct').onclick=cutLayer;
function splitChars(l){if(l.type!=='text')return;const chars=[...l.text];if(chars.filter(c=>c.trim()).length<2)return toast('2文字以上のテキストが必要です');if(chars.length>80)return toast('文字数が多すぎます(80文字まで)');
cx.font=FONT;const ws=chars.map(c=>cx.measureText(c).width),tot=cx.measureText(l.text).width,kids=[];
chars.forEach((ch,i)=>{const mx=-tot/2+cx.measureText(chars.slice(0,i+1).join('')).width-ws[i]/2;if(!ch.trim())return;
const c={id:uid++,type:'text',text:ch,color:l.color,x:mx,y:0,s:1,r:0,o:l.o??1,z:0,rx:0,ry:0,d3:!!l.d3,par:l.id,st:l.st,en:l.en,kf:[],fx:JSON.parse(JSON.stringify(l.fx||[]))};
if(l.kf.length)c.kf=l.kf.map(k=>{const q={t:k.t,x:mx,y:0,s:1,r:0,o:k.o??1,z:0,rx:0,ry:0};if(k.E)q.E=JSON.parse(JSON.stringify(k.E));if(k.bz)q.bz=[...k.bz];if(k.e)q.e=k.e;return q});kids.push(c)});
l.type='null';l.fx=[];l.color='#9aa0a6';l.o=1;L.splice(L.indexOf(l)+1,0,...kids);sel=l.id;tl();pan();toast(kids.length+'文字にレイヤー化しました')}
